# Mianne Benchwork: Netlify config. build/ is the repo root.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 301 map: old WordPress URLs to the new site (seo.md). Netlify matches with or
# without a trailing slash. /about, /contact and /assembly need no rule: Netlify
# pretty URLs already send them to the trailing-slash pages.

[[redirects]]
  from = "/catalog/kits"
  to = "/catalog/"
  status = 301
  force = true

[[redirects]]
  from = "/catalog/kits/starter-kits"
  to = "/catalog/starter-kits/"
  status = 301
  force = true

